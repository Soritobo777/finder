<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FINDER — AI Flow</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 15% 20%, #182c5c 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #35145c 0%, transparent 35%),
                #070a14;

            padding: 50px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 45px;
        }

        .logo {
            font-size: 62px;
            font-weight: 900;
            letter-spacing: 10px;

            background: linear-gradient(
                90deg,
                #6d7cff,
                #a55cff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-top: 15px;
            color: #b9c0d8;
            font-size: 20px;
        }

        .finder-box {
            background: rgba(20, 25, 43, 0.88);
            border: 1px solid #2d3757;
            border-radius: 25px;

            padding: 30px;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.35);
        }

        textarea {
            width: 100%;
            min-height: 185px;

            resize: vertical;

            background: #0b1020;
            border: 1px solid #33405f;
            border-radius: 18px;

            color: white;

            padding: 25px;

            font-size: 18px;
            line-height: 1.6;

            outline: none;
        }

        textarea:focus {
            border-color: #7b68ff;
            box-shadow: 0 0 0 3px rgba(123,104,255,0.15);
        }

        textarea::placeholder {
            color: #6f7892;
        }

        .main-button {
            width: 100%;

            margin-top: 22px;

            border: none;
            border-radius: 17px;

            padding: 22px;

            font-size: 20px;
            font-weight: bold;

            color: white;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #5b7cff,
                #a34dff
            );

            transition: 0.2s;
        }

        .main-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .main-button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            margin-top: 18px;
        }

        .example {
            border: 1px solid #303b5b;
            background: #11182a;

            color: #d9def0;

            padding: 11px 16px;

            border-radius: 30px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }

        .example:hover {
            background: #1b2540;
            border-color: #6878ff;
        }

        .result {
            margin-top: 30px;

            display: none;

            background: rgba(12, 17, 31, 0.95);

            border: 1px solid #303b5b;

            border-radius: 22px;

            padding: 30px;
        }

        .result.visible {
            display: block;
        }

        .result-title {
            font-size: 25px;
            font-weight: bold;

            margin-bottom: 22px;
        }

        .brain {
            display: inline-block;

            padding: 8px 13px;

            border-radius: 20px;

            background: rgba(110, 92, 255, 0.15);

            color: #a99cff;

            font-size: 13px;

            margin-bottom: 20px;
        }

        .ai-response {
            white-space: pre-wrap;

            color: #dce2f4;

            font-size: 17px;

            line-height: 1.75;
        }

        .loading {
            display: none;

            text-align: center;

            padding: 30px;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 4px solid #29324c;
            border-top-color: #8c6cff;

            border-radius: 50%;

            margin: auto;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        .loading-text {
            margin-top: 18px;
            color: #aeb7d0;
        }

        .error {
            color: #ff8f8f;
            background: rgba(255, 70, 70, 0.08);

            border: 1px solid rgba(255, 70, 70, 0.25);

            border-radius: 15px;

            padding: 18px;

            line-height: 1.6;
        }

        @media (max-width: 700px) {

            body {
                padding: 25px 12px;
            }

            .logo {
                font-size: 42px;
            }

            .subtitle {
                font-size: 16px;
            }

            .finder-box {
                padding: 18px;
            }

            textarea {
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            FINDER
        </div>

        <div class="subtitle">
            Tu GPS para encontrar, combinar y utilizar inteligencias artificiales.
        </div>

    </div>


    <div class="finder-box">

        <textarea
            id="goal"
            placeholder="Cuéntame qué quieres conseguir...

Ejemplo:
Quiero crear un anuncio para Instagram con una imagen, convertirla en vídeo y ponerle una voz."
        ></textarea>


        <button
            id="flowButton"
            class="main-button"
            onclick="createFlow()"
        >
            🚀 CREAR MI FLOW
        </button>


        <div class="examples">

            <button
                class="example"
                onclick="useExample('Quiero crear un anuncio completo para Instagram con una imagen, convertirla en vídeo y añadirle una voz.')"
            >
                📱 Anuncio completo
            </button>

            <button
                class="example"
                onclick="useExample('Quiero crear un vídeo para YouTube con guion, imágenes, vídeo y voz.')"
            >
                ▶️ Vídeo YouTube
            </button>

            <button
                class="example"
                onclick="useExample('Quiero crear una aplicación web desde cero.')"
            >
                💻 Crear aplicación
            </button>

            <button
                class="example"
                onclick="useExample('Quiero preparar un examen y necesito estudiar, resumir y practicar.')"
            >
                📚 Preparar examen
            </button>

            <button
                class="example"
                onclick="useExample('Quiero crear una marca desde cero y hacer contenido visual y vídeo para ella.')"
            >
                🎨 Marca + vídeo
            </button>

        </div>


        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            <div class="loading-text">
                🧠 FINDER está analizando tu objetivo...
            </div>

        </div>


        <div
            id="result"
            class="result"
        >

            <div class="brain">
                🧠 FINDER AI BRAIN
            </div>

            <div class="result-title">
                Tu FLOW
            </div>

            <div
                id="aiResponse"
                class="ai-response"
            ></div>

        </div>

    </div>

</div>


<script>

async function createFlow() {

    const goalInput = document.getElementById("goal");
    const button = document.getElementById("flowButton");

    const loading = document.getElementById("loading");
    const result = document.getElementById("result");
    const aiResponse = document.getElementById("aiResponse");

    const goal = goalInput.value.trim();


    // Comprobar que existe un objetivo
    if (!goal) {

        alert("Cuéntame primero qué quieres conseguir 🚀");

        goalInput.focus();

        return;
    }


    // Estado de carga
    button.disabled = true;

    button.textContent = "🧠 ANALIZANDO...";

    result.classList.remove("visible");

    loading.classList.add("visible");


    try {

        console.log("🚀 Enviando objetivo a FINDER...");

        const response = await fetch("/api/finder", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                goal: goal
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Error desconocido del servidor."
            );

        }


        console.log("✅ Respuesta recibida del cerebro");


        // Mostrar respuesta
        aiResponse.textContent = data.result;

        result.classList.add("visible");


    } catch (error) {

        console.error(error);


        aiResponse.innerHTML = `
            <div class="error">
                ❌ FINDER no pudo conectar con el cerebro de IA.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        result.classList.add("visible");

    } finally {

        loading.classList.remove("visible");

        button.disabled = false;

        button.textContent = "🚀 CREAR MI FLOW";

    }

}


function useExample(text) {

    const goal = document.getElementById("goal");

    goal.value = text;

    goal.focus();

}


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>

</html>
